<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#5CF2C4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1B1035" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4FD8"/>
      <stop offset="100%" stop-color="#F4F0FF"/>
    </linearGradient>
    <linearGradient id="scrollGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5CF2C4"/>
      <stop offset="100%" stop-color="#F4F0FF"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F0FF"/>
      <stop offset="100%" stop-color="#FF4FD8"/>
    </linearGradient>
  </defs>

  <!-- Backdrop square -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="#1B1035"/>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bgGlow)"/>
  <rect x="16" y="16" width="224" height="224" rx="40" fill="none" stroke="#5CF2C4" stroke-width="1.5" opacity="0.35"/>

  <!-- Scroll body (tilted, off-center) -->
  <g transform="translate(128 132) rotate(-12)">
    <!-- Scroll parchment -->
    <path d="M-62,-48 L50,-48 Q62,-48 62,-36 L62,24 Q62,36 50,36 L-52,36 Q-64,36 -64,24 L-64,-36 Q-64,-48 -52,-48 Z" fill="#F4F0FF" opacity="0.12"/>
    <path d="M-58,-44 L48,-44 Q56,-44 56,-36 L56,20 Q56,28 48,28 L-52,28 Q-60,28 -60,20 L-60,-36 Q-60,-44 -52,-44 Z" fill="url(#scrollGrad)" opacity="0.9"/>

    <!-- Scroll rolled edges -->
    <path d="M-60,-44 Q-68,-44 -68,-32 Q-68,-20 -60,-20 L-60,-44 Z" fill="#5CF2C4"/>
    <path d="M56,-44 Q64,-44 64,-32 Q64,-20 56,-20 L56,-44 Z" fill="#5CF2C4"/>
    <path d="M-60,20 Q-68,20 -68,32 Q-68,44 -60,44 L-60,20 Z" fill="#5CF2C4"/>
    <path d="M56,20 Q64,20 64,32 Q64,44 56,44 L56,20 Z" fill="#5CF2C4"/>

    <!-- Script lines on scroll -->
    <line x1="-42" y1="-26" x2="38" y2="-26" stroke="#1B1035" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="-42" y1="-12" x2="28" y2="-12" stroke="#1B1035" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <line x1="-42" y1="2" x2="34" y2="2" stroke="#1B1035" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="-42" y1="16" x2="18" y2="16" stroke="#1B1035" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Paw print fused over scroll (upper-right) -->
  <g transform="translate(154 92)">
    <!-- Main pad -->
    <path d="M0,28 Q-22,28 -28,12 Q-34,-4 -20,-16 Q-8,-26 0,-26 Q8,-26 20,-16 Q34,-4 28,12 Q22,28 0,28 Z" fill="url(#pawGrad)"/>
    <!-- Toe beans -->
    <ellipse cx="-32" cy="-20" rx="10" ry="13" transform="rotate(-18 -32 -20)" fill="#FF4FD8"/>
    <ellipse cx="-14" cy="-36" rx="9" ry="12" transform="rotate(-6 -14 -36)" fill="#FF4FD8"/>
    <ellipse cx="8" cy="-38" rx="9" ry="12" transform="rotate(8 8 -38)" fill="#FF4FD8"/>
    <ellipse cx="26" cy="-24" rx="10" ry="13" transform="rotate(20 26 -24)" fill="#FF4FD8"/>

    <!-- Inner glow on pad -->
    <path d="M0,22 Q-16,22 -21,10 Q-26,-2 -16,-11 Q-6,-19 0,-19 Q6,-19 16,-11 Q26,-2 21,10 Q16,22 0,22 Z" fill="#F4F0FF" opacity="0.35"/>
  </g>

  <!-- Sparkle (small, mischievous, upper-left area) -->
  <g transform="translate(90 62)">
    <path d="M0,-18 L3.5,-5.5 L16,-2 L3.5,1.5 L0,14 L-3.5,1.5 L-16,-2 L-3.5,-5.5 Z" fill="url(#sparkGrad)"/>
    <path d="M0,-10 L1.8,-3 L9,-1 L1.8,1 L0,8 L-1.8,1 L-9,-1 L-1.8,-3 Z" fill="#F4F0FF" opacity="0.8"/>
  </g>

  <!-- Tiny secondary sparkle -->
  <g transform="translate(214 168)">
    <path d="M0,-9 L2,-2.5 L8,0 L2,2.5 L0,9 L-2,2.5 L-8,0 L-2,-2.5 Z" fill="#5CF2C4" opacity="0.75"/>
  </g>

  <!-- Accent dash marks for energy -->
  <line x1="42" y1="196" x2="58" y2="204" stroke="#FF4FD8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="36" y1="208" x2="48" y2="214" stroke="#5CF2C4" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="210" y1="48" x2="224" y2="42" stroke="#5CF2C4" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Wordmark: tiny, bottom -->
  <text x="128" y="228" text-anchor="middle" font-family="monospace, sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#F4F0FF" opacity="0.45">ADOPT·ME·SCRIPT·HUB</text>
</svg>
